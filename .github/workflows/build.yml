name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format & Publish Check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Auto-format & Commit
        if: github.event_name == 'push'
        run: |
          dart format .
          if ! git diff --exit-code '*.dart'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format Dart files [ci skip]"
            git push
          fi

      - name: Verify Formatting (PR only)
        if: github.event_name == 'pull_request'
        run: |
          dart format .
          if ! git diff --exit-code '*.dart'; then
            echo "⚠️ Formatting issues detected. Run 'dart format .' locally."
            exit 1
          fi

      - name: Dart Pub Publish Check (dry-run)
        run: dart pub publish --dry-run
