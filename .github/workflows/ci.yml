name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze, Test & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Apply safe auto-fixes (dart fix)
        run: dart fix --apply

      - name: Verify no pending auto-fixes remain
        run: |
          if ! git diff --exit-code; then
            echo "dart fix produced changes. Run 'dart fix --apply' locally and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Flutter Analyze
        run: flutter analyze

      - name: Run the test suite
        run: flutter test
