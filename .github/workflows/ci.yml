name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze & Auto-fix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Auto-fix & Commit
        if: github.event_name == 'push'
        run: |
          dart fix --apply lib
          if ! git diff --exit-code lib/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: auto-apply dart fixes [ci skip]"
            git push
          fi

      - name: Verify no pending fixes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          dart fix --apply lib
          if ! git diff --exit-code lib/; then
            echo "⚠️ Pending dart fixes. Run 'dart fix --apply lib' locally."
            exit 1
          fi

      - name: Flutter Analyze (errors & warnings only)
        run: flutter analyze --no-fatal-infos
