name: Bug Report
description: Create a report to help us improve Gallery Suite
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Please provide as much information as possible to help us reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happens...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen? What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce the behavior? Providing a minimal code snippet highly increases the chance of it being fixed.
      placeholder: |
        1. Open the picker using CustomMediaPicker.show(...)
        2. Set config property X to Y
        3. Tap on Z
        4. See error
    validations:
      required: true
  - type: input
    id: target_platform
    attributes:
      label: Target Platform & OS Version
      description: E.g., iOS 16.4, Android 13 (API 33), Web Chrome, macOS 14.1
      placeholder: e.g. Android 13
    validations:
      required: true
  - type: input
    id: flutter_version
    attributes:
      label: Flutter Version
      description: The output of `flutter --version`
      placeholder: e.g. 3.19.0
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Gallery Suite Version
      description: Check pubspec.yaml for the current version you are using
      placeholder: e.g. 1.0.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Stack Trace
      description: Please paste any relevant crash logs or console output.
      render: shell
    validations:
      required: false
