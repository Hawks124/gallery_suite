name: gallery_suite
description: >-
  Ultimate Flutter media picker featuring a built-in Google Photos provider and BYOE architecture. Includes 120fps masonry grid, swipe-to-select, camera, and inline audio/video.
version: 1.0.0
homepage: https://github.com/Hawks124/gallery_suite
repository: https://github.com/Hawks124/gallery_suite
issue_tracker: https://github.com/Hawks124/gallery_suite/issues

topics:
  - image
  - video
  - audio
  - media
  - gallery
  - assets
  - camera
  - photo
  - image-picker
  - media-picker
  - cloud-picker
  - google-photos
  - masonry

# platforms:
#   android:
#   ios:
#   linux:
#   macos:
#   web:
#   windows:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.9.0
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.10.0
  just_audio: ^0.10.4
  camera: ^0.12.0
  camera_windows: ^0.2.6+4
  camera_macos: ^0.0.9
  camera_linux: ^0.0.8
  google_sign_in: ^7.2.0
  http: ^1.3.0
  cached_network_image_ce: ^4.6.4
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis_auth: ^2.0.0
  app_links: ^7.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.7
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  google_sign_in_web: ^1.1.3
  pasteboard: ^0.5.0
  mime: ^2.0.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/images/
