name: gallery_suite
description: >-
  In-app Flutter media picker with a built-in Google Photos provider, 5 grid layouts
  (incl. BYOG), swipe-to-select, multi-capture camera and inline audio/video playback.
version: 1.0.0
homepage: https://github.com/Hawks124/gallery_suite
repository: https://github.com/Hawks124/gallery_suite
issue_tracker: https://github.com/Hawks124/gallery_suite/issues

# pub.dev accepts a maximum of 5 topics. The full set lives in the GitHub repo topics.
topics:
  - image-picker
  - media-picker
  - gallery
  - camera
  - google-photos

platforms:
  android:
  ios:
  macos:
  windows:
  linux:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.9.0
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.10.0
  just_audio: ^0.10.4
  camera: ^0.12.0
  camera_windows: ">=0.2.6+4 <0.4.0"
  camera_macos: ">=0.0.9 <0.2.0"
  camera_linux: ^0.0.8
  google_sign_in: ^7.2.0
  http: ^1.3.0
  cached_network_image_ce: ^4.6.4
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis_auth: ^2.0.0
  app_links: ^7.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.7
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  google_sign_in_web: ^1.1.3
  pasteboard: ^0.5.0
  mime: ^2.0.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/

# Screenshots published on the pub.dev package page.
# Every file must live inside the published archive and stay under 4 MB.
screenshots:
  - description: >-
      The image picker: a 120fps masonry grid mixing local media, Google Photos
      cloud assets and clipboard items, with multi-select and swipe-to-select.
    path: doc/screenshots/image_picker.gif
  - description: >-
      Swipe-to-select: long-press and drag across the grid to select many items
      at once, iOS Photos style, with edge auto-scrolling.
    path: doc/screenshots/swipe_to_select.gif
  - description: >-
      The audio picker: a list view with album art and an inline mini-player for
      instant playback, no round-trip to a native view.
    path: doc/screenshots/audio_picker.gif
