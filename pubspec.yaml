name: gallery_suite
description: >-
  Flutter media picker for images, videos & audio — fully in-app, no native OS
  dialog. Masonry grid, multi-select, inline video preview, inline audio
  playback, album switcher, dark/light theme. Drop-in replacement for
  image_picker when you need a custom gallery UI.
version: 1.0.0
homepage: https://github.com/Hawks124/gallery_suite
repository: https://github.com/Hawks124/gallery_suite
issue_tracker: https://github.com/Hawks124/gallery_suite/issues

topics:
  - image
  - video
  - audio
  - gallery
  - media

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.9.0
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.10.0
  just_audio: ^0.10.4
  camera: ^0.12.0
  camera_windows: ^0.2.6+4
  camera_macos: ^0.0.9
  camera_linux: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
